<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>KidRoutine</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033}.app{max-width:560px;margin:auto;padding:18px 16px 90px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;font-weight:850}.pill{background:white;border-radius:20px;padding:8px 12px;box-shadow:0 2px 10px #0001}.kids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.kid{border:0;padding:14px;border-radius:18px;background:white;font-weight:750;font-size:16px;box-shadow:0 3px 12px #0001}.kid.active{outline:3px solid #5687ff}.hero{background:white;border-radius:24px;padding:18px;box-shadow:0 4px 18px #0001}.score{font-size:40px;font-weight:900}.bar{height:12px;background:#e7ebf2;border-radius:10px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#5687ff}.small{color:#687386;font-size:14px}.section{font-size:19px;font-weight:850;margin:22px 2px 10px}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:12px;background:white;padding:14px;border-radius:18px;box-shadow:0 2px 10px #0001;cursor:pointer}.task.done{opacity:.62}.icon{font-size:25px;width:34px}.taskname{font-weight:720;flex:1}.pts{font-weight:850;color:#416bd6}.check{width:29px;height:29px;border:2px solid #ccd3df;border-radius:50%;display:grid;place-items:center;font-weight:900}.done .check{background:#dff6e7;border-color:#5bb779}.reward{background:#fff6db;border-radius:20px;padding:15px;margin-top:18px}.weekly{background:white;border-radius:20px;padding:15px;margin-top:12px}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;border:0;border-radius:14px;padding:12px;background:#e9eef8;font-weight:750}button{cursor:pointer}.note{text-align:center;margin-top:18px;color:#7a8495;font-size:12px}</style></head><body><main class='app'><div class='top'><div class='brand'>⭐ KidRoutine</div><div class='pill' id='date'></div></div><div class='kids'><button class='kid active' data-k='0'>👦 Abrar</button><button class='kid' data-k='1'>👧 Ahrar</button></div><section class='hero'><div class='small'>TODAY'S SCORE</div><div class='score'><span id='score'>0</span> ⭐</div><div class='bar'><div class='fill' id='fill' style='width:0%'></div></div><div id='goal'>100 points unlocks today's reward</div></section><div class='section'>Today's routine</div><div class='tasks' id='tasks'></div><div class='reward' id='reward'><b>🎁 Daily reward</b><div class='small'>Reach 100 points → ice cream or extra fun time.</div></div><div class='weekly'><b>🏆 Weekly progress</b><div style='font-size:25px;font-weight:900;margin-top:6px'><span id='weekly'>0</span> ⭐</div><div class='small'>500 → Movie night &nbsp; • &nbsp; 1,000 → Big surprise</div></div><div class='actions'><button id='rename'>✏️ Rename</button><button id='reset'>↻ Reset today</button></div><div class='note'>Progress is saved on this device.</div></main><script>
const tasks=[['⏰','Wake up on time for school',20],['🪥','Brush teeth — morning',10],['👕','Get dressed & ready',10],['🛏️','Make / organize bed',10],['🥣','Eat breakfast',10],['🥪','Eat lunch',15],['📚','Do homework',20],['🤝','Play nicely / share',10],['🧸','Put toys away',15],['🧹','Help with a small chore',15],['🚿','Bath / shower',10],['🪥','Brush teeth — night',10],['🌙','Get ready for bed on time',15]];
const key='kidroutine-v1';let state=JSON.parse(localStorage.getItem(key)||'null')||{kids:[{name:'Abrar',days:{}},{name:'Ahrar',days:{}}],active:0};if(state.kids[0].name==='Child 1')state.kids[0].name='Abrar';if(state.kids[1].name==='Child 2')state.kids[1].name='Ahrar';const today=()=>new Date().toISOString().slice(0,10);function day(){let k=state.kids[state.active];return k.days[today()]||(k.days[today()]={done:Array(tasks.length).fill(false)});}function save(){localStorage.setItem(key,JSON.stringify(state))}function score(d){return d.done.reduce((s,x,i)=>s+(x?tasks[i][2]:0),0)}function weekScore(){let now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);let k=state.kids[state.active],sum=0;for(let i=0;i<7;i++){let d=new Date(mon);d.setDate(mon.getDate()+i);let x=k.days[d.toISOString().slice(0,10)];if(x)sum+=score(x)}return sum}function render(){document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});document.querySelectorAll('.kid').forEach((b,i)=>{b.classList.toggle('active',i===state.active);b.textContent=(i?'👧 ':'👦 ')+state.kids[i].name});let d=day(),s=score(d);document.getElementById('score').textContent=s;document.getElementById('fill').style.width=Math.min(100,s)+'%';document.getElementById('goal').textContent=s>=100?'🎉 Today’s reward unlocked!':(100-s)+' more points to today’s reward';document.getElementById('weekly').textContent=weekScore();document.getElementById('tasks').innerHTML=tasks.map((t,i)=>`<div class="task ${d.done[i]?'done':''}" data-i="${i}"><div class="icon">${t[0]}</div><div class="taskname">${t[1]}</div><div class="pts">+${t[2]}</div><div class="check">${d.done[i]?'✓':''}</div></div>`).join('');document.querySelectorAll('.task').forEach(el=>el.onclick=()=>{d.done[+el.dataset.i]=!d.done[+el.dataset.i];save();render()});save()}
document.querySelectorAll('.kid').forEach((b,i)=>b.onclick=()=>{state.active=i;save();render()});document.getElementById('rename').onclick=()=>{let n=prompt('Child name:',state.kids[state.active].name);if(n&&n.trim()){state.kids[state.active].name=n.trim();save();render()}};document.getElementById('reset').onclick=()=>{if(confirm('Clear today’s completed tasks?')){state.kids[state.active].days[today()]={done:Array(tasks.length).fill(false)};save();render()}};render();
</script></body></html>
